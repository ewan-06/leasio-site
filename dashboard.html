<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="base_icon_transparent_background.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account | Leasio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
    </style>
</head>
<body class="antialiased selection:bg-blue-600 selection:text-white min-h-screen flex flex-col">

    <!-- NAVIGATION BAR -->
    <header class="relative z-50 border-b border-slate-200 bg-white/90 backdrop-blur-md sticky top-0">
      <div class="mx-auto flex h-20 max-w-[1600px] items-center px-5 sm:px-8 lg:px-12 relative">
        <div class="flex items-center gap-6 lg:gap-10 flex-1">
          <a aria-label="Leasio home" class="min-w-0 shrink-0 block" href="index.html">
            <img src="base_logo_transparent_background.png" alt="Leasio" width="260" height="80" loading="eager"
              class="block h-auto max-h-10 w-auto max-w-full object-contain md:max-h-12">
          </a>
          <nav aria-label="Main navigation" class="hidden md:flex items-center gap-1">
            <a class="px-4 py-6 font-mono text-[11px] tracking-[0.12em] text-slate-600 transition-colors hover:text-blue-600" href="search.html">CARS</a>
            <a class="px-4 py-6 font-mono text-[11px] tracking-[0.12em] text-slate-600 transition-colors hover:text-blue-600" href="search.html?type=vans">VANS</a>
            <a class="px-4 py-6 font-mono text-[11px] tracking-[0.12em] text-slate-600 transition-colors hover:text-blue-600" href="index.html#best-offers-section">OFFERS</a>
          </nav>
        </div>
        <div class="flex items-center gap-3">
          <a href="dashboard.html" class="px-4 py-6 font-mono text-[11px] tracking-[0.12em] text-blue-600 font-bold">Account</a>
          <a class="border border-blue-600 px-6 py-2.5 font-mono text-[11px] tracking-[0.12em] text-blue-600 rounded-xl transition-colors hover:bg-blue-600 hover:text-white shadow-sm" href="search.html">SEARCH</a>
        </div>
      </div>
    </header>

    <!-- DASHBOARD CONTENT -->
    <main class="flex-1 max-w-5xl mx-auto px-4 py-12 w-full">
        <div class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider bg-blue-100 text-blue-700 mb-2">
                    Member Dashboard
                </span>
                <h1 id="welcome-heading" class="text-3xl font-extrabold text-slate-900">Welcome back</h1>
                <p class="text-sm text-slate-500 mt-1">Manage your personal details and saved lease configurations.</p>
            </div>
            <button id="logout-btn" class="self-start sm:self-auto border border-red-200 bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs uppercase tracking-wider px-5 py-3 rounded-xl transition">
                Sign Out
            </button>
        </div>

        <!-- Account Info Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/90 p-6 sm:p-8 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Full Name</h3>
                <p id="user-name" class="text-base font-bold text-slate-900">-</p>
            </div>
            <div>
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Email Address</h3>
                <p id="user-email" class="text-base font-bold text-slate-900">-</p>
            </div>
        </div>
    </main>

    <script src="nav.js"></script>
    <script>
        // Check if user is logged in, otherwise kick them back to login.html
        const userJson = localStorage.getItem('leasio_user');
        if (!userJson) {
            window.location.href = 'login.html';
        } else {
            const user = JSON.parse(userJson);
            document.getElementById('welcome-heading').textContent = `Welcome back, ${user.first_name}`;
            document.getElementById('user-name').textContent = `${user.first_name} ${user.last_name}`;
            document.getElementById('user-email').textContent = user.email;
        }

        // Handle Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('leasio_user');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
