<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="base_icon_transparent_background.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Leasio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc; /* Soft Slate-50 background */
            color: #0f172a; /* Deep Slate-900 text */
        }
    </style>
</head>
<body class="antialiased selection:bg-blue-600 selection:text-white min-h-screen flex flex-col">

    <!-- 1. NAVIGATION BAR -->
    <header class="relative z-50 border-b border-slate-200 bg-white/90 backdrop-blur-md sticky top-0">
      <div class="mx-auto flex h-20 max-w-[1600px] items-center px-5 sm:px-8 lg:px-12 relative">
        
        <!-- LEFT SIDE: Logo & Navigation Menu -->
        <div class="flex items-center gap-6 lg:gap-10 flex-1">
          <a aria-label="Leasio home" class="min-w-0 shrink-0 block" href="index.html">
            <img src="base_logo_transparent_background.png" alt="Leasio" width="260" height="80" loading="eager"
              class="block h-auto max-h-10 w-auto max-w-full object-contain md:max-h-12">
          </a>

          <nav aria-label="Main navigation" class="hidden md:flex items-center gap-1">
            <a class="px-4 py-6 font-mono text-[11px] tracking-[0.12em] text-slate-600 transition-colors hover:text-blue-600" href="search.html">CARS</a>
            <a class="px-4 py-6 font-mono text-[11px] tracking-[0.12em] text-slate-600 transition-colors hover:text-blue-600" href="search.html?type=vans">VANS</a>
            <a class="px-4 py-6 font-mono text-[11px] tracking-[0.12em] text-slate-600 transition-colors hover:text-blue-600" href="index.html#best-offers-section">OFFERS</a>
          </nav>
        </div>

        <!-- RIGHT SIDE: Action Buttons -->
        <div class="flex items-center gap-2">
          <a class="hidden sm:inline-block px-4 py
        <a class="px-4 py-6 font-mono text-[11px] tracking-[0.12em] text-slate-600 transition-colors hover:text-blue-600" href="about-us.html">About Us</a>
          <a class="px-4 py-6 font-mono text-[11px] tracking-[0.12em] text-blue-600 font-bold transition-colors" href="login.html">Login</a>
          
          <div class="flex items-center gap-3 shrink-0 ml-2">
            <a class="border border-blue-600 px-6 py-2.5 font-mono text-[11px] tracking-[0.12em] text-blue-600 rounded-xl transition-colors hover:bg-blue-600 hover:text-white shadow-sm" href="search.html">SEARCH</a>
          </div>
        </div>
      </div>
    </header>

    <!-- 2. LOGIN SECTION -->
    <main class="flex-1 flex items-center justify-center px-4 py-12 bg-gradient-to-b from-white via-blue-50/40 to-slate-50">
        <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-xl shadow-slate-900/5 border border-slate-200/90 w-full max-w-md">
            
            <!-- Header Badge & Title -->
            <div class="text-center mb-8">
                <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider bg-blue-100 text-blue-700 mb-3">
                    Customer Portal
                </span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Welcome back</h1>
                <p class="text-sm text-slate-500 mt-1.5">Sign in to manage your vehicle lease deals</p>
            </div>

            <!-- Registration Success Banner (Shown when redirected from register.html) -->
            <div id="registered-banner" class="hidden mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold flex items-center gap-2.5">
                <span class="w-5 h-5 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold shrink-0">✓</span>
                <span>Account created! Please sign in below.</span>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="flex flex-col gap-5">
                <div>
                    <label for="email" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">
                        Email Address
                    </label>
                    <input type="email" id="email" required placeholder="you@example.com"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 outline-none transition">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label for="password" class="block text-xs font-bold text-slate-500 uppercase tracking-wider">
                            Password
                        </label>
                        <a href="#" class="text-xs font-semibold text-blue-600 hover:text-blue-700 transition">Forgot password?</a>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 outline-none transition">
                </div>

                <!-- Error Message Display -->
                <p id="error-message" class="text-red-600 bg-red-50 border border-red-200 rounded-xl px-4 py-2.5 text-xs font-medium hidden"></p>

                <button type="submit" id="submit-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm py-3.5 rounded-xl shadow-md shadow-blue-600/20 hover:shadow-lg hover:shadow-blue-600/30 transition flex items-center justify-center gap-2 mt-1">
                    <span>Sign In</span>
                    <span>&rarr;</span>
                </button>
            </form>

            <!-- Footer Link to Register -->
            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-500 font-medium">
                    Don't have an account yet? 
                    <a href="register.html" class="text-blue-600 font-bold hover:text-blue-700 transition ml-1">Create an account &rarr;</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = "https://leasio-api.onrender.com";

        // 1. Check if the user just registered (?registered=true)
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('registered') === 'true') {
                document.getElementById('registered-banner').classList.remove('hidden');
            }
        });

        // 2. Handle Login Submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const errorMsg = document.getElementById('error-message');
            const submitBtn = document.getElementById('submit-btn');
            errorMsg.classList.add('hidden');
            
            // Disable button & show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Signing in...</span>';

            const payload = {
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    // Save user info in localStorage so your other pages know the user is logged in
                    localStorage.setItem('leasio_user', JSON.stringify(data.user));
                    
                    // Redirect to homepage
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = data.detail || "Invalid email or password.";
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = "Could not connect to the server. Please try again.";
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Sign In</span><span>&rarr;</span>';
            }
        });
    </script>
</body>
</html>
