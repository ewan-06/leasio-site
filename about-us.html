<!DOCTYPE html>
<html lang="en">
<body class="antialiased selection:bg-blue-600 selection:text-white min-h-screen flex flex-col justify-between gif-background relative">

    <!-- Dark Overlay to ensure text readability over the background GIF -->
    <div class="absolute inset-0 bg-[#00282f]/75 z-0"></div>

    <!-- NAVIGATION BAR (Made completely transparent so it floats over the GIF) -->
    <header class="relative z-10 border-b border-white/10 bg-transparent">
      <div class="mx-auto flex h-20 max-w-[1600px] items-center px-5 sm:px-8 lg:px-12">
        <a aria-label="Leasio home" class="block" href="index.html">
          <img src="base_logo_transparent_background.png" alt="Leasio" width="260" height="80" loading="eager"
            class="block h-auto max-h-10 w-auto object-contain md:max-h-12">
        </a>
      </div>
    </header>

    <!-- CONTENT SECTION -->
    <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-16">
        <div class="max-w-md w-full text-center">
            
            <!-- Badge -->
            <span class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-[11px] font-bold uppercase tracking-wider bg-[#00859b]/20 text-[#00859b] border border-[#00859b]/30 mb-6">
                Launching Soon
            </span>

            <!-- Heading & Text matching your theme colour -->
            <h1 class="text-3xl font-extrabold text-[#00859b] mb-3">Something exciting is on the way</h1>
            <p class="text-sm font-medium text-[#00859b]/90 leading-relaxed mb-8">
                We are currently upgrading our platform. Please check back shortly.
            </p>

            <!-- Optional Home Button -->
            <a href="index.html" class="inline-block bg-[#00859b] hover:bg-[#006f81] text-white font-bold text-xs uppercase tracking-wider px-6 py-3 rounded-xl shadow-md transition">
                &larr; Back to Home
            </a>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="relative z-10 py-6 text-center text-xs text-[#00859b]/60 border-t border-white/10 bg-transparent">
        &copy; 2026 Leasio. All rights reserved.
    </footer>
<script>
        function toggleMegaMenu(id) {
          const menus = document.querySelectorAll('.leasio-mega-menu');
          const target = document.getElementById(id);
          menus.forEach(menu => { if (menu !== target) menu.classList.add('hidden'); });
          target.classList.toggle('hidden');
        }
        document.addEventListener('click', function (event) {
          if (!event.target.closest('.leasio-nav-container')) {
            document.querySelectorAll('.leasio-mega-menu').forEach(menu => menu.classList.add('hidden'));
          }
        });
          // nav.js
        document.addEventListener("DOMContentLoaded", () => {
            const userJson = localStorage.getItem('leasio_user');
            
            // Find all elements or links that point to login or act as the auth button
            // You can target them by looking for href="login.html" or a specific ID
            const loginLinks = document.querySelectorAll('a[href="login.html"], a[href="register.html"]');
            
            if (userJson) {
                try {
                    const user = JSON.parse(userJson);
                    
                    // Loop through login/register links in the nav and convert them to "Account"
                    loginLinks.forEach(link => {
                        // Only convert if it's the main login/auth nav item (avoid footer links if needed)
                        if (link.textContent.includes("Login") || link.getAttribute("href") === "login.html") {
                            link.textContent = "Account";
                            link.setAttribute("href", "dashboard.html");
                            link.className = "px-4 py-6 font-mono text-[11px] tracking-[0.12em] text-blue-600 font-bold transition-colors";
                        }
                    });
                } catch (e) {
                    console.error("Failed to parse user session", e);
                    localStorage.removeItem('leasio_user');
                }
            }
        });

  </script>
</body>
</html>
