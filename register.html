<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | Leasio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen py-10">

  <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 w-full max-w-lg">
    <h2 class="text-2xl font-extrabold text-slate-900 mb-6 text-center">Create your account</h2>

    <p class="text-xs text-slate-500 text-center mt-4">
  Already have an account? <a href="login.html" class="text-blue-600 font-bold hover:underline">Sign in</a>
</p>
    
    <form id="register-form" class="flex flex-col gap-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="first_name" class="block text-xs font-bold text-slate-500 uppercase mb-1">First Name</label>
          <input type="text" id="first_name" required class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none">
        </div>
        <div>
          <label for="last_name" class="block text-xs font-bold text-slate-500 uppercase mb-1">Last Name</label>
          <input type="text" id="last_name" required class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none">
        </div>
      </div>

      <div>
        <label for="dob" class="block text-xs font-bold text-slate-500 uppercase mb-1">Date of Birth</label>
        <input type="date" id="dob" required class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none">
      </div>

      <div>
        <label for="email" class="block text-xs font-bold text-slate-500 uppercase mb-1">Email Address</label>
        <input type="email" id="email" required class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none">
      </div>

      <div>
        <label for="phone" class="block text-xs font-bold text-slate-500 uppercase mb-1">Phone Number</label>
        <input type="tel" id="phone" required class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none">
      </div>

      <div>
        <label for="address" class="block text-xs font-bold text-slate-500 uppercase mb-1">Full Address</label>
        <textarea id="address" required rows="2" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none"></textarea>
      </div>

      <div>
        <label for="password" class="block text-xs font-bold text-slate-500 uppercase mb-1">Password</label>
        <input type="password" id="password" required minlength="8" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none">
      </div>

      <p id="error-message" class="text-red-500 text-xs hidden"></p>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-colors mt-2">
        Create Account
      </button>
    </form>
  </div>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const errorMsg = document.getElementById('error-message');
      errorMsg.classList.add('hidden');
      
      // Build the JSON payload matching the Pydantic model
      const payload = {
        first_name: document.getElementById('first_name').value,
        last_name: document.getElementById('last_name').value,
        date_of_birth: document.getElementById('dob').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        password: document.getElementById('password').value
      };

      try {
        const response = await fetch('https://leasio-api.onrender.com/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = 'login.html?registered=true';
        } else {
          errorMsg.textContent = data.detail || "An error occurred during registration.";
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = "Could not connect to the server.";
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
