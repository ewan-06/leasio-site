<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="images/base_icon_transparent_background.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Leasio</title>
  <link href="output.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700;9..40,800&family=Source+Sans+3:wght@400;500;600;700&display=block"
    rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    h1, h2, h3 {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.02em;
    }
  </style>
</head>

<body class="antialiased selection:bg-blue-600 selection:text-white min-h-screen flex flex-col">

  <!-- Minimal Header -->
  <header class="bg-white border-b border-slate-200/70">
    <div class="max-w-[1200px] mx-auto px-5 py-3 flex items-center justify-between" style="min-height: 76px;">
      <a href="main.html" aria-label="Leasio home" class="block">
        <img src="images/base_logo_transparent_background.png" alt="Leasio Logo" width="260" height="80"
          class="block w-auto object-contain" style="height: 60px; max-height: 60px;">
      </a>
      <a href="login.html" class="text-sm font-semibold text-blue-600 hover:underline">Back to Login</a>
    </div>
  </header>

  <!-- Main Reset Card -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl p-8 shadow-xl shadow-slate-900/5">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 text-center">Set a new password</h1>
      <p class="text-sm text-slate-500 text-center mt-2 mb-6">Choose a strong password of at least 8 characters.</p>

      <form id="reset-password-form" class="flex flex-col gap-4" novalidate>
        <div>
          <label for="new-password" class="block text-xs font-bold text-slate-500 uppercase mb-1">New Password</label>
          <input type="password" id="new-password" required minlength="8" placeholder="At least 8 characters"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600">
        </div>

        <div>
          <label for="confirm-password" class="block text-xs font-bold text-slate-500 uppercase mb-1">Confirm New Password</label>
          <input type="password" id="confirm-password" required minlength="8" placeholder="Re-enter your new password"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600">
        </div>

        <p id="reset-error" class="hidden text-red-600 bg-red-50 border border-red-200 rounded-xl px-4 py-2.5 text-xs font-medium"></p>
        <p id="reset-success" class="hidden text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-2.5 text-xs font-semibold"></p>

        <button type="submit" id="reset-submit-btn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm py-3.5 rounded-xl shadow-md shadow-blue-600/20 transition mt-1">
          Update Password
        </button>
      </form>
    </div>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = (params.get("token") || "").trim();

      const form = document.getElementById("reset-password-form");
      const errorEl = document.getElementById("reset-error");
      const successEl = document.getElementById("reset-success");
      const submitBtn = document.getElementById("reset-submit-btn");

      if (!token) {
        errorEl.textContent = "Missing or invalid password reset link. Please request a new one from the login page.";
        errorEl.classList.remove("hidden");
        submitBtn.disabled = true;
        submitBtn.classList.add("opacity-50", "cursor-not-allowed");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.classList.add("hidden");
        successEl.classList.add("hidden");

        const newPassword = document.getElementById("new-password").value;
        const confirmPassword = document.getElementById("confirm-password").value;

        if (newPassword.length < 8) {
          errorEl.textContent = "Password must be at least 8 characters long.";
          errorEl.classList.remove("hidden");
          return;
        }

        if (newPassword !== confirmPassword) {
          errorEl.textContent = "Passwords do not match.";
          errorEl.classList.remove("hidden");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Updating...";

        try {
          const res = await fetch("https://leasio-api.onrender.com/api/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, new_password: newPassword })
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok) {
            successEl.textContent = "Password updated! Redirecting to login...";
            successEl.classList.remove("hidden");
            form.reset();
            setTimeout(() => { window.location.href = "login.html"; }, 1800);
          } else {
            errorEl.textContent = data.detail || "Invalid or expired reset link.";
            errorEl.classList.remove("hidden");
            submitBtn.disabled = false;
            submitBtn.textContent = "Update Password";
          }
        } catch (_) {
          errorEl.textContent = "Could not connect to the server. Please try again.";
          errorEl.classList.remove("hidden");
          submitBtn.disabled = false;
          submitBtn.textContent = "Update Password";
        }
      });
    })();
  </script>
</body>

</html>
