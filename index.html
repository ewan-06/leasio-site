<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="base_icon_transparent_background.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon | Leasio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #00282f; /* Matches your site's soft Slate-50 background */
            color: #00859b; /* Deep Slate-900 text */
        }
    </style>
</head>
<body class="antialiased selection:bg-blue-600 selection:text-white min-h-screen flex flex-col justify-between">

    <!-- NAVIGATION BAR -->
    <header class="border-b border-slate-200 bg-white/90 backdrop-blur-md sticky top-0 z-50">
      <div class="mx-auto flex h-20 max-w-[1600px] items-center px-5 sm:px-8 lg:px-12">
        <a aria-label="Leasio home" class="block" href="index.html">
          <img src="base_logo_transparent_background.png" alt="Leasio" width="260" height="80" loading="eager"
            class="block h-auto max-h-10 w-auto object-contain md:max-h-12">
        </a>
      </div>
    </header>

    <!-- CONTENT SECTION -->
    <main class="flex-1 flex items-center justify-center px-4 py-16">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl shadow-slate-900/5 border border-slate-200/90 p-8 text-center">
            
            <!-- Badge -->
            <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider bg-blue-100 text-blue-700 mb-6">
                Launching Soon
            </span>

            <!-- GIF Container -->
            <div class="mb-6 overflow-hidden rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center">
                <img src="comingsoongif.gif" alt="Coming soon animation" class="w-full h-auto max-h-64 object-contain">
            </div>

            <!-- Heading & Text -->
            <h1 class="text-2xl font-extrabold text-slate-900 mb-2">Something exciting is on the way</h1>
            <p class="text-sm text-slate-500 leading-relaxed mb-8">
                We are currently upgrading our platform. Please check back shortly.
            </p>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-6 text-center text-xs text-slate-400 border-t border-slate-200/60">
        &copy; 2026 Leasio. All rights reserved.
    </footer>

</body>
</html>
